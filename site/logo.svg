<svg viewBox="0 0 420 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=DM+Mono:wght@400&amp;display=swap');
      .wm { font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; }
      .sub { font-family: 'DM Mono', 'Courier New', monospace; font-weight: 400; }
    </style>
  </defs>

  <!-- ── MARK (plumb bob) ───────────────────────────────── -->
  <!-- string -->
  <line x1="22" y1="4" x2="22" y2="16" stroke="#163322" stroke-width="1.8" stroke-linecap="round"/>
  <!-- eyelet ring (brass accent) -->
  <circle cx="22" cy="21" r="5.5" stroke="#9a7840" stroke-width="1.6" fill="none"/>
  <!-- cap plate -->
  <rect x="13" y="26" width="18" height="5" rx="0.5" fill="#163322"/>
  <!-- upper body (cylinder taper) -->
  <path d="M 13 31 L 11 36 L 10 54 L 12 60 L 22 60 L 32 60 L 34 54 L 33 36 L 31 31 Z" fill="#163322"/>
  <!-- lower body cone -->
  <path d="M 12 60 L 22 84 L 32 60 Z" fill="#163322"/>
  <!-- depth facet – mid line -->
  <line x1="10" y1="48" x2="34" y2="48" stroke="white" stroke-width="0.8" stroke-opacity="0.18"/>
  <!-- depth facet – upper shoulder -->
  <line x1="11" y1="36" x2="33" y2="36" stroke="white" stroke-width="0.5" stroke-opacity="0.12"/>
  <!-- left-face specular sheen -->
  <path d="M 11.5 37 L 13.5 37 L 12.5 58 L 10.5 55 Z" fill="white" fill-opacity="0.09"/>
  <!-- point highlight (brass tip) -->
  <path d="M 20 78 L 22 84 L 24 78 Z" fill="#9a7840" fill-opacity="0.7"/>

  <!-- ── WORDMARK ─────────────────────────────────────────── -->
  <text x="60" y="52" class="wm" font-size="38" fill="#163322" letter-spacing="0.5">THE PLUMB LINE</text>
  <text x="61" y="70" class="sub" font-size="10" fill="#4e7d63" letter-spacing="3.5">PRECISION PLUMBING · SACRAMENTO</text>
</svg>
